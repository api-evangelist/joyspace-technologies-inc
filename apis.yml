aid: joyspace-technologies-inc
name: JoySpace Technologies, Inc.
description: >-
  JoySpace Technologies, Inc. (Joyspace) operates an enterprise AI video
  transformation platform that turns long-form video into viral short clips,
  captions in 99+ languages, and repurposed content at scale for B2B marketing,
  sales, podcast, agency, and executive-branding teams. It combines AI clip
  generation, agentic video-processing workflows, and multimodal semantic search
  across large video archives, processing 10,000+ videos monthly on
  enterprise-grade infrastructure. Joyspace exposes a REST API
  (POST /api/v1/videos/process) secured with Bearer API keys, signed webhooks
  with automatic retry, and cloud-storage connectors for AWS S3, Google Cloud
  Storage, Azure Blob Storage, Cloudflare R2, and Dropbox Business. The company
  is a 500 Global portfolio company.
